name: Veille immo

on:
  schedule:
    - cron: "*/5 * * * *"      # toutes les 5 minutes (au mieux)
  workflow_dispatch:            # bouton "Run workflow" pour lancer à la main
    inputs:
      test:
        description: "Envoyer une notification de test avec le bilan"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/veille.yml

      - name: Installer les outils
        run: |
          pip install playwright pyyaml requests
          python -m playwright install --with-deps chromium

      - name: Lancer la veille
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python veille.py --test
          else
            python veille.py
          fi

      - name: Enregistrer les annonces déjà vues
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add etat RAPPORT.md
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Mise à jour de la veille"
            git pull --rebase
            git push
          fi
