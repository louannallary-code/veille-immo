# ============================================================
#  VEILLE IMMO — tes critères et la liste des sites surveillés
#  C'est le seul fichier que tu auras à modifier.
# ============================================================

criteres:
  loyer_max: 1000          # en €, charges comprises
  surface_min: 25          # en m²
  pieces_min: 2
  meuble: non              # "non" = on ignore les annonces meublées
  codes_postaux: ["75011"] # arrondissements acceptés

# Pour chaque agence :
#   nom : le nom affiché dans les notifications
#   url : la page de résultats à surveiller.
#         Le mieux : fais ta recherche sur le site avec tes filtres
#         (location, Paris 11e, 2 pièces…) puis copie l'adresse de la page.
#   motif (facultatif) : un morceau d'adresse que contiennent tous les
#         liens d'annonces de ce site. Si absent, le script devine.
#   actif : mettre "non" pour mettre une agence en pause.

agences:
